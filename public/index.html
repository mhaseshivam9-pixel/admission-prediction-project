<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Prediction Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000010;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #2457d6;
      color: white;
    }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Admission Prediction</h1>
    <p>
      A machine-learning project for estimating graduate
      admission chances from applicant information.
    </p>
    <p>
      This application uses a trained regression model.
      Its predictions are estimates, not admission decisions.
    </p>
    <button id="check">Check API connection</button>
    <p id="status">API status has not been checked yet.</p>
  </main>

  <script>
    document.getElementById("check").addEventListener("click", async () => {
      const status = document.getElementById("status");
      status.textContent = "Checking connection...";

      try {
        const response = await fetch("/api");
        const data = await response.json();

        if (!response.ok) {
          throw new Error("API returned an error.");
        }

        status.textContent = data.message || "API connected.";
      } catch (error) {
        status.textContent =
          "Could not connect to the API. Check the deployment logs.";
      }
    });
  </script>
</body>
</html>
