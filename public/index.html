<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduate Admission Prediction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f9;
      color: #222;
    }

    .container {
      max-width: 1050px;
      margin: 20px auto;
      padding: 35px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 15px;
      font-size: 34px;
      color: #171717;
    }

    .description {
      margin-bottom: 25px;
      line-height: 1.5;
      color: #444;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 17px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #d5d9df;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #9bbcff;
      border-color: #2563eb;
    }

    .research-field {
      margin-top: 20px;
      max-width: calc(50% - 10px);
    }

    button {
      margin-top: 24px;
      padding: 15px 24px;
      border: none;
      border-radius: 8px;
      background: #1763d1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background: #104da8;
    }

    button:disabled {
      background: #9ca3af;
      color: #f3f4f6;
      cursor: not-allowed;
      opacity: 0.85;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #result.success {
      display: block;
      background: #ecfdf3;
      border: 1px solid #a7e8c0;
      color: #166534;
    }

    #result.error {
      display: block;
      background: #fff1f0;
      border: 1px solid #ffc9c5;
      color: #a32118;
    }

    .result-label {
      margin-bottom: 5px;
      font-size: 17px;
      font-weight: bold;
    }

    .percentage {
      margin: 8px 0;
      font-size: 36px;
      font-weight: bold;
    }

    .disclaimer {
      margin-top: 25px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .container {
        margin: 8px auto;
        padding: 22px 18px;
      }

      h1 {
        font-size: 27px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .research-field {
        max-width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Graduate Admission Prediction</h1>

    <p class="description">
      Enter the applicant's academic profile to estimate their
      Chance of Admit using the trained regression model.
    </p>

    <form id="admissionForm">
      <div class="form-grid">
        <div class="field">
          <label for="gre">GRE Score (260–340)</label>
          <input
            id="gre"
            name="GRE Score"
            type="number"
            min="260"
            max="340"
            step="1"
            value="320"
            required
          >
        </div>

        <div class="field">
          <label for="toefl">TOEFL Score (0–120)</label>
          <input
            id="toefl"
            name="TOEFL Score"
            type="number"
            min="0"
            max="120"
            step="1"
            value="110"
            required
          >
        </div>

        <div class="field">
          <label for="university">University Rating (1–5)</label>
          <select id="university" name="University Rating" required>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
          </select>
        </div>

        <div class="field">
          <label for="sop">SOP Rating (1–5)</label>
          <input
            id="sop"
            name="SOP"
            type="number"
            min="1"
            max="5"
            step="0.5"
            value="4"
            required
          >
        </div>

        <div class="field">
          <label for="lor">LOR Rating (1–5)</label>
          <input
            id="lor"
            name="LOR"
            type="number"
            min="1"
            max="5"
            step="0.5"
            value="4"
            required
          >
        </div>

        <div class="field">
          <label for="cgpa">CGPA (0–10)</label>
          <input
            id="cgpa"
            name="CGPA"
            type="number"
            min="0"
            max="10"
            step="0.01"
            value="9"
            required
          >
        </div>
      </div>

      <div class="field research-field">
        <label for="research">Research Experience</label>
        <select id="research" name="Research" required>
          <option value="1" selected>Yes</option>
          <option value="0">No</option>
        </select>
      </div>

      <button id="predictButton" type="submit">
        Predict Admission Chance
      </button>
    </form>

    <div
      id="result"
      role="status"
      aria-live="polite"
    ></div>

    <p class="disclaimer">
      Disclaimer: This is a model-generated estimate, not an official
      admission probability or guarantee of admission.
    </p>
  </main>

  <script>
    const form = document.getElementById("admissionForm");
    const button = document.getElementById("predictButton");
    const resultBox = document.getElementById("result");

    function showError(message) {
      resultBox.className = "error";
      resultBox.replaceChildren();

      const title = document.createElement("div");
      title.className = "result-label";
      title.textContent = "Prediction could not be generated";

      const messageText = document.createElement("div");
      messageText.textContent = message;

      resultBox.append(title, messageText);
    }

    function showPrediction(percentage) {
      resultBox.className = "success";
      resultBox.replaceChildren();

      const title = document.createElement("div");
      title.className = "result-label";
      title.textContent = "Estimated Chance of Admit";

      const value = document.createElement("div");
      value.className = "percentage";
      value.textContent = percentage.toFixed(2) + "%";

      const note = document.createElement("div");
      note.textContent =
        "This is an estimate produced by your trained regression model.";

      resultBox.append(title, value, note);
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      // Make the button dull and prevent duplicate submissions.
      button.disabled = true;
      button.textContent = "Predicting... Please wait";
      resultBox.className = "";
      resultBox.style.display = "none";
      resultBox.replaceChildren();

      const payload = {
        "GRE Score": Number(form.elements["GRE Score"].value),
        "TOEFL Score": Number(form.elements["TOEFL Score"].value),
        "University Rating": Number(
          form.elements["University Rating"].value
        ),
        "SOP": Number(form.elements["SOP"].value),
        "LOR": Number(form.elements["LOR"].value),
        "CGPA": Number(form.elements["CGPA"].value),
        "Research": Number(form.elements["Research"].value)
      };

      try {
        const response = await fetch("/api", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const responseText = await response.text();
        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "The server returned an invalid response. " +
            "Please check the Vercel runtime logs."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            `The server returned HTTP ${response.status}.`
          );
        }

        if (data.status && data.status !== "success") {
          throw new Error(
            data.message || "The prediction request failed."
          );
        }

        // Match the exact field names returned by your working API.
        const rawPercentage = data.predicted_percentage;

        const rawChance = data.predicted_chance;

        let percentage;

        if (
          rawPercentage !== undefined &&
          rawPercentage !== null &&
          rawPercentage !== ""
        ) {
          percentage = Number(rawPercentage);
        } else if (
          rawChance !== undefined &&
          rawChance !== null &&
          rawChance !== ""
        ) {
          percentage = Number(rawChance) * 100;
        } else {
          console.error("Unexpected API response:", data);

          throw new Error(
            "The API returned successfully but did not include " +
            "predicted_percentage or predicted_chance."
          );
        }

        if (!Number.isFinite(percentage)) {
          throw new Error(
            "The API returned a prediction that is not a valid number."
          );
        }

        // This model predicts a chance on a 0–1 scale, shown as 0–100%.
        // Keep the displayed percentage within the valid percentage range.
        percentage = Math.max(0, Math.min(100, percentage));

        showPrediction(percentage);

      } catch (error) {
        console.error("Admission prediction error:", error);
        showError(error.message || "An unexpected error occurred.");
      } finally {
        // Restore the button whether prediction succeeds or fails.
        button.disabled = false;
        button.textContent = "Predict Admission Chance";
        resultBox.style.display = "";
      }
    });
  </script>
</body>
</html>
